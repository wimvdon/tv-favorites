# Deploys the Nuvio add-on (nuvio-addon/, a Cloudflare Worker) when it changes on main.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and
# CLOUDFLARE_ACCOUNT_ID; FIREBASE_API_KEY is passed on to the Worker as a secret.
# Without the Cloudflare secrets the tests run and the deploy is skipped.
name: Nuvio add-on

on:
  push:
    branches: [main]
    paths:
      - "nuvio-addon/**"
      - ".github/workflows/nuvio-addon.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuvio-addon
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nuvio-addon
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test
        run: node --test

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: the add-on was not deployed."
            exit 0
          fi
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "::error::FIREBASE_API_KEY is not set: the add-on cannot read the list."
            exit 1
          fi
          npx --yes wrangler@4.160.0 deploy
          printf '%s' "$FIREBASE_API_KEY" | npx --yes wrangler@4.160.0 secret put FIREBASE_API_KEY
          echo "### Deployed: https://tv-favorites-nuvio.wim-8af.workers.dev" >> "$GITHUB_STEP_SUMMARY"
