# The TV Favorites add-on for Nuvio. Deployed by .github/workflows/nuvio-addon.yml.
name = "tv-favorites-nuvio"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "tv-favorites"

# The add-on's own anonymous Firebase identity (not a secret of the user's list).
# No id on purpose: the first `wrangler deploy` creates the namespace in the Cloudflare account
# (automatic provisioning) and later deploys keep using the one bound to the Worker.
[[kv_namespaces]]
binding = "IDENTITY"

# FIREBASE_API_KEY is a secret, set by the deploy workflow from the repository secret.
